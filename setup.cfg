[metadata]
name = napari-fenestra
version = 0.3.0
description = FenestRA: A Napari plugin for LSEC AFM Super-Resolution & Fenestration Analysis.
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/LIVR-VUB/FenestRA
author = Arkajyoti Sarkar
author_email = arkajyoti.sarkar@vub.be
license = BSD-3-Clause
license_files = LICENSE
classifiers =
    Development Status :: 3 - Alpha
    Framework :: napari
    Intended Audience :: Developers
    License :: OSI Approved :: BSD License
    Operating System :: OS Independent
    Programming Language :: Python
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.10
    Topic :: Scientific/Engineering :: Image Processing

[options]
packages = find:
install_requires =
    numpy>=1.26.0,<2.0.0
    magicgui
    qtpy
    scikit-image
    scipy
    tifffile
    # >= 4.0.1 is a hard floor, not a preference: from that release CellposeModel ignores
    # model_type, so the plugin constructs it without one. On cellpose 2 or 3 that call has
    # no model to load.
    cellpose>=4.0.1
    pandas
    openpyxl
    # The only reader for .jpk-qi-image. It used to be installable from git alone, which is
    # why it was absent here; it is on PyPI now, so the package can finally declare it.
    AFMReader>=0.0.7
    # An AFMReader dependency. 0.6.3 requires numpy>=2, which contradicts the numpy pin above.
    pySPM<0.6.3
# Upper bound is not arbitrary: pySPM 0.6.x declares >=3.10,<3.13, and numpy 1.26.4 has no
# wheels past cp312. Without it, pip on 3.13 fails at dependency resolution instead of telling
# the user their Python is too new.
python_requires = >=3.10,<3.13
include_package_data = True
package_dir =
    =src

[options.packages.find]
where = src

[options.entry_points]
napari.manifest =
    napari-fenestra = fenestra:napari.yaml

[options.package_data]
* = *.yaml
